<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سكوب الألعاب</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<style>
:root{
  --ink:#1b1f3b; --paper:#fff8e7; --sun:#ffc83d; --coral:#ff5a5f; --mint:#2ec4a6; --sky:#3a86ff; --white:#fff;
  --display:'Lalezar','Tajawal',sans-serif; --body:'Tajawal','Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--body);color:var(--ink);background:var(--paper);
  background-image:radial-gradient(var(--sun) 1.5px,transparent 1.5px);background-size:28px 28px;background-position:0 0;
  display:flex;justify-content:center;padding:24px 16px 48px}
main{width:100%;max-width:560px}
header{text-align:center;margin-bottom:22px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,12vw,64px);margin:0;line-height:1.1;
  display:inline-block;background:var(--coral);color:var(--white);padding:2px 22px 8px;border:3px solid var(--ink);
  border-radius:18px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-2deg)}
header p{margin:18px 0 0;font-size:18px;font-weight:500}

.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px;min-height:44px}
.chip{font:inherit;font-weight:700;font-size:16px;padding:8px 18px;border:2.5px solid var(--ink);border-radius:999px;
  background:var(--white);color:var(--ink);cursor:pointer;transition:transform .12s,background .12s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sun)}
.chips .hint{font-size:16px;opacity:.7}

.machine{background:var(--sky);border:3px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);
  padding:28px 20px 24px;text-align:center}
.ball{width:210px;height:210px;margin:0 auto 22px;border-radius:50%;border:3px solid var(--ink);
  background:linear-gradient(to bottom,var(--coral) 0 50%,var(--white) 50% 100%);position:relative;display:grid;place-items:center;
  box-shadow:inset -12px -12px 0 rgba(27,31,59,.12)}
.ball::before{content:"";position:absolute;inset:50% 0 auto 0;height:3px;background:var(--ink);transform:translateY(-1.5px)}
.num{position:relative;z-index:1;min-width:110px;padding:2px 14px 6px;background:var(--sun);border:3px solid var(--ink);border-radius:16px;
  font-family:var(--display);font-size:46px;line-height:1.2;color:var(--ink)}
.ball.spin{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-3px)}100%{transform:rotate(-5deg)}}

.go{font-family:var(--display);font-size:30px;padding:6px 44px 12px;border:3px solid var(--ink);border-radius:18px;cursor:pointer;
  background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.go:hover{background:#ffd45f}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.go:disabled{opacity:.6;cursor:wait}
.chip:focus-visible,.go:focus-visible,.buy:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

.result{display:none;margin-top:28px;background:var(--white);border:3px solid var(--ink);border-radius:24px;
  box-shadow:8px 8px 0 var(--mint);overflow:hidden;text-align:center}
.result.show{display:block;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.pic{background:#f1f1f1;border-bottom:3px solid var(--ink);aspect-ratio:4/3;display:grid;place-items:center}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.info{padding:20px 20px 24px}
.tag{display:inline-block;background:var(--mint);border:2.5px solid var(--ink);border-radius:999px;padding:2px 14px;font-weight:700;font-size:15px;margin-bottom:10px}
.info h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.35;margin:0 0 16px}
.buy{display:inline-block;text-decoration:none;font-weight:700;font-size:19px;padding:12px 32px;border:3px solid var(--ink);
  border-radius:14px;background:var(--coral);color:var(--white);box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.buy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.again{margin:14px 0 0;font-size:15px;opacity:.7}

.rate{margin-top:22px;padding-top:18px;border-top:2.5px dashed var(--ink)}
.rate[hidden]{display:none}
.avg{font-weight:700;font-size:18px;margin:0 0 8px}
.avg b{color:var(--coral);font-size:22px}
.stars{display:inline-flex;gap:2px}
.star{font-size:36px;line-height:1.1;background:none;border:0;padding:0 3px;cursor:pointer;color:#d9d9d9;
  -webkit-text-stroke:1.5px var(--ink);transition:transform .1s}
.star.on{color:var(--sun)}
.star:hover:not(:disabled){transform:scale(1.2)}
.star:disabled{cursor:default}
.star:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
.rate-msg{font-size:15px;margin:6px 0 0;min-height:1.4em}

.foot{margin-top:36px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.fbtn{font:inherit;font-weight:700;font-size:15px;padding:9px 18px;border:2.5px solid var(--ink);border-radius:999px;background:var(--white);
  color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;transition:transform .12s}
.fbtn:hover{transform:translateY(-2px)}
.fbtn[hidden]{display:none}
.fbtn.dc{background:#5865f2;color:#fff}
.fbtn.tg{background:#229ed9;color:#fff}
dialog{border:3px solid var(--ink);border-radius:20px;padding:22px;max-width:92vw;width:420px;font-family:var(--body);
  color:var(--ink);background:var(--white);box-shadow:8px 8px 0 var(--ink)}
dialog::backdrop{background:rgba(27,31,59,.55)}
dialog h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 6px}
dialog label{display:block;font-weight:700;margin:12px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;font:inherit;padding:10px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
dialog input[readonly]{background:#eee}
dialog textarea{resize:vertical;min-height:70px}
.r-name{margin:6px 0 0;font-size:15px;opacity:.8}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden;opacity:0}
#cf-box{margin-top:12px}
.dlg-msg{min-height:1.4em;margin:10px 0 0;font-size:15px;font-weight:500}
.dlg-actions{display:flex;gap:10px;margin-top:14px}
.dlg-actions button{flex:1;font:inherit;font-weight:700;font-size:16px;padding:11px;border:3px solid var(--ink);border-radius:12px;cursor:pointer}
.send{background:var(--coral);color:#fff}
.send:disabled{opacity:.6;cursor:wait}
.cancel{background:#fff;color:var(--ink)}

@media (prefers-reduced-motion:reduce){.ball.spin,.result.show{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>سكوب الألعاب</h1>
    <p>اختر القسم، واسحب لعبة بالحظ!</p>
  </header>

  <div class="chips" id="chips" role="group" aria-label="الأقسام">
    <span class="hint">جارٍ تحميل الأقسام...</span>
  </div>

  <section class="machine">
    <div class="ball" id="ball"><div class="num" id="number-display" aria-live="polite">؟</div></div>
    <button class="go" id="go" onclick="startScoop()" disabled>ابدأ السكوب!</button>
  </section>

  <article class="result" id="product-result">
    <div class="pic"><img id="p-image" alt=""></div>
    <div class="info">
      <span class="tag" id="p-cat"></span>
      <h2 id="p-name"></h2>
      <a id="p-link" class="buy" href="#" target="_blank" rel="noopener sponsored">رابط اللعبة</a>
      <div class="rate" id="rate" hidden>
        <p class="avg" id="avg"></p>
        <div class="stars" id="stars" role="group" aria-label="قيّم اللعبة"></div>
        <p class="rate-msg" id="rate-msg"></p>
      </div>
      <p class="again">لم تعجبك؟ اضغط «ابدأ السكوب» مرة أخرى.</p>
    </div>
  </article>
<footer class="foot">
    <button class="fbtn" id="btn-report" type="button">🚩 التبليغ عن لعبة</button>
    <a class="fbtn dc" id="btn-discord" target="_blank" rel="noopener" hidden>💬 سيرفر ديسكورد</a>
    <a class="fbtn tg" id="btn-telegram" target="_blank" rel="noopener" hidden>✈️ قناة تلغرام</a>
  </footer>
</main>

<dialog id="report-dialog">
  <form id="report-form">
    <h3>التبليغ عن لعبة</h3>
    <label for="r-id">رقم اللعبة</label>
    <input id="r-id" inputmode="numeric" maxlength="10">
    <p class="r-name" id="r-name"></p>

    <label for="r-reason">سبب التبليغ</label>
    <select id="r-reason">
      <option value="">اختر السبب...</option>
      <option>قمار أو مراهنات</option>
      <option>محتوى غير أخلاقي أو غير لائق</option>
      <option>عنف مبالغ فيه</option>
      <option>محتوى مسيء أو يحرّض على الكراهية</option>
      <option>اللعبة لا تعمل أو الرابط خاطئ</option>
      <option>صورة أو اسم غير مناسب</option>
      <option>سبب آخر</option>
    </select>

    <label for="r-note">تفاصيل إضافية (اختياري)</label>
    <textarea id="r-note" maxlength="300"></textarea>

    <div class="hp" aria-hidden="true"><label for="r-hp">اترك هذا الحقل فارغاً</label><input id="r-hp" tabindex="-1" autocomplete="off"></div>

    <div id="math-box"><label for="r-math" id="math-q"></label><input id="r-math" inputmode="numeric" autocomplete="off"></div>
    <div id="cf-box"></div>

    <p class="dlg-msg" id="r-msg" role="status"></p>
    <div class="dlg-actions">
      <button type="submit" class="send" id="r-send">إرسال البلاغ</button>
      <button type="button" class="cancel" id="r-cancel">إلغاء</button>
    </div>
  </form>
</dialog>

<script>
  let allProducts = [];
  let currentCategory = "الكل";
  const $ = id => document.getElementById(id);

  // الصورة الافتراضية للألعاب بلا صورة (لتغييرها: ضع رابط صورتك بدل السطر التالي، مثل 'https://.../default.png')
  const DEFAULT_IMAGE = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a86ff"/><stop offset="1" stop-color="#2ec4a6"/></linearGradient>' +
    '<pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#fff" fill-opacity=".25"/></pattern></defs>' +
    '<rect width="400" height="300" fill="url(#g)"/><rect width="400" height="300" fill="url(#d)"/>' +
    '<g transform="translate(200 150)" stroke="#1b1f3b" stroke-width="6" stroke-linejoin="round">' +
    '<path d="M-95 -35Q-95 -55 -70 -55H70Q95 -55 95 -35L115 40Q120 70 90 70Q70 70 55 45H-55Q-70 70 -90 70Q-120 70 -115 40Z" fill="#ffc83d"/>' +
    '<path d="M-70 -20h14v-14h14v14h14v14h-14v14h-14v-14h-14z" fill="#1b1f3b" stroke="none"/>' +
    '<circle cx="55" cy="-22" r="10" fill="#ff5a5f"/><circle cx="80" cy="0" r="10" fill="#ff5a5f"/></g></svg>');

  // ===== التقييم المشترك =====
  // ضع هنا رابط تطبيق الويب (Web app URL) من Apps Script. اتركه فارغاً لإخفاء التقييم.
  const RATINGS_URL = 'https://script.google.com/macros/s/AKfycbyRaVsBX-aN2EH3KpQIErWGqAA2qnsj0jqMsbZIUGS26f_CDjp0c_z0rTp9DTRERirb/exec';

  let ratings = {};      // { مفتاح اللعبة: {sum, count} }
  let currentKey = '';
  const myVotes = () => { try { return JSON.parse(localStorage.getItem('myVotes') || '{}'); } catch (e) { return {}; } };
  const saveVote = (k, n) => { try { const v = myVotes(); v[k] = n; localStorage.setItem('myVotes', JSON.stringify(v)); } catch (e) {} };

  if (RATINGS_URL) {
    fetch(RATINGS_URL).then(r => r.json()).then(d => { ratings = d || {}; }).catch(() => {});
  }

  const starBtns = [];
  for (let n = 1; n <= 5; n++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'star';
    b.textContent = '★';
    b.setAttribute('aria-label', n + ' من 5');
    b.onmouseenter = b.onfocus = () => paintStars(n);
    b.onmouseleave = b.onblur = () => paintStars(myVotes()[currentKey] || 0);
    b.onclick = () => vote(n);
    $('stars').appendChild(b);
    starBtns.push(b);
  }
  function paintStars(n) { starBtns.forEach((b, i) => b.classList.toggle('on', i < n)); }

  function renderRating(key) {
    if (!RATINGS_URL) { $('rate').hidden = true; return; }
    currentKey = key;
    $('rate').hidden = false;
    const r = ratings[key];
    $('avg').innerHTML = r && r.count
      ? '<b>' + (r.sum / r.count).toFixed(1) + '</b> ★ من ' + r.count + ' تقييم'
      : 'لا توجد تقييمات بعد';
    const mine = myVotes()[key] || 0;
    paintStars(mine);
    starBtns.forEach(b => { b.disabled = !!mine; });
    $('rate-msg').textContent = mine ? 'شكراً! تقييمك: ' + '★'.repeat(mine) : 'جرّبتها؟ قيّمها!';
  }

  function vote(n) {
    const key = currentKey;
    if (!key || myVotes()[key]) return;
    const r = ratings[key] || { sum: 0, count: 0 };
    ratings[key] = { sum: r.sum + n, count: r.count + 1 };
    saveVote(key, n);
    renderRating(key);
    fetch(RATINGS_URL + '?action=rate&key=' + encodeURIComponent(key) + '&stars=' + n)
      .then(res => res.json())
      .then(d => {
        if (!d.ok) throw new Error();
        if (key === currentKey) { ratings[key] = { sum: d.sum, count: d.count }; renderRating(key); }
      })
      .catch(() => {
        ratings[key] = r;
        try { const v = myVotes(); delete v[key]; localStorage.setItem('myVotes', JSON.stringify(v)); } catch (e) {}
        if (key === currentKey) { renderRating(key); $('rate-msg').textContent = 'تعذّر إرسال التقييم، حاول مرة أخرى.'; }
      });
  }

  // تحميل المنتجات من جوجل شيت
  Papa.parse("https://docs.google.com/spreadsheets/d/e/2PACX-1vSw87IsGoLaeGQJkF2KWvc7PI4LSe8AV7pXflgEZl_YOGZtRZdwLxoZPGGEwt5tiygaxeoTWHD6bbRv/pub?output=csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function (results) {
      allProducts = results.data.filter(p => p.Name);
      fillCategories();
      $('go').disabled = allProducts.length === 0;
    },
    error: function () {
      $('chips').innerHTML = '<span class="hint">تعذّر تحميل الألعاب. حدّث الصفحة وحاول مرة أخرى.</span>';
    }
  });

  // أزرار الأقسام
  function fillCategories() {
    const box = $('chips');
    const cats = ["الكل", ...new Set(allProducts.map(p => (p.Category || '').trim()).filter(Boolean))];
    box.innerHTML = '';
    cats.forEach(cat => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = cat === "الكل" ? "كل الأنواع" : cat;
      b.setAttribute('aria-pressed', cat === currentCategory);
      b.onclick = () => {
        currentCategory = cat;
        box.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
      };
      box.appendChild(b);
    });
  }

  function startScoop() {
    const filtered = currentCategory === "الكل"
      ? allProducts
      : allProducts.filter(p => (p.Category || '').trim() === currentCategory);
    if (filtered.length === 0) return alert("لا توجد ألعاب في هذا القسم.");

    const btn = $('go'), ball = $('ball');
    btn.disabled = true;
    ball.classList.add('spin');
    $('product-result').classList.remove('show');

    let count = 0;
    const timer = setInterval(() => {
      $('number-display').textContent = Math.floor(Math.random() * 999);
      if (++count > 20) {
        clearInterval(timer);
        ball.classList.remove('spin');
        btn.disabled = false;
        showFinal(filtered);
      }
    }, 50);
  }

  function showFinal(list) {
    const p = list[Math.floor(Math.random() * list.length)];
    $('number-display').textContent = p.ID || '★';
    $('p-name').textContent = p.Name;
    $('p-cat').textContent = p.Category || '';
    $('p-cat').style.display = p.Category ? 'inline-block' : 'none';
    const img = $('p-image');
    img.alt = p.Name;
    const hasImage = /^https?:\/\//.test((p.Image_URL || '').trim());
    const useDefault = () => { img.onerror = null; img.onload = null; img.src = DEFAULT_IMAGE; };
    img.onerror = useDefault;
    img.onload = () => { if (img.naturalWidth < 20 || img.naturalHeight < 20) useDefault(); };  // صورة فارغة/صغيرة جداً
    img.src = hasImage ? p.Image_URL.trim() : DEFAULT_IMAGE;
    $('p-link').href = p.Affiliate_Link || '#';
    shownGame = p;
    renderRating((p.Affiliate_Link || p.Name || '').trim());
    const res = $('product-result');
    void res.offsetWidth;
    res.classList.add('show');
    res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ===== التبليغ وروابط المجتمع =====
  const DISCORD_URL = '';         // رابط دعوة سيرفر ديسكورد
  const TELEGRAM_URL = '';        // رابط قناة تلغرام، مثل https://t.me/اسم_القناة
  const TURNSTILE_SITE_KEY = '0x4AAAAAAF5zsn40p17VlfTU';  // اختياري: المفتاح العام لـ Cloudflare Turnstile. إن تُرك فارغاً يُستخدم سؤال حسابي بسيط.

  let shownGame = null, cfToken = '', cfWidget = null, tsLoading = false, mathAns = 0;
  [['btn-discord', DISCORD_URL], ['btn-telegram', TELEGRAM_URL]].forEach(([id, url]) => {
    if (url) { $(id).href = url; $(id).hidden = false; }
  });

  const dlg = $('report-dialog');
  const rmsg = t => { $('r-msg').textContent = t; };
  const reported = () => { try { return JSON.parse(localStorage.getItem('myReports') || '{}'); } catch (e) { return {}; } };

  function newChallenge() {
    if (TURNSTILE_SITE_KEY) {
      $('math-box').hidden = true;
      const render = () => {
        cfToken = '';
        if (cfWidget !== null) turnstile.reset(cfWidget);
        else cfWidget = turnstile.render('#cf-box', { sitekey: TURNSTILE_SITE_KEY, callback: t => { cfToken = t; }, 'expired-callback': () => { cfToken = ''; } });
      };
      if (window.turnstile) render();
      else if (!tsLoading) {
        tsLoading = true;
        const sc = document.createElement('script');
        sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        sc.onload = render;
        document.head.appendChild(sc);
      }
    } else {
      $('math-box').hidden = false;
      const a = 2 + Math.floor(Math.random() * 8), b = 2 + Math.floor(Math.random() * 8);
      mathAns = a + b;
      $('math-q').textContent = 'للتأكد أنك لست روبوتاً: كم ناتج ' + a + ' + ' + b + ' ؟';
      $('r-math').value = '';
    }
  }

  $('btn-report').onclick = () => {
    const g = shownGame;
    $('r-id').value = g && g.ID ? String(g.ID).trim() : '';
    $('r-id').readOnly = !!(g && g.ID);
    $('r-name').textContent = g ? g.Name : 'لم تسحب لعبة بعد، اكتب رقم اللعبة التي تريد التبليغ عنها.';
    $('r-reason').value = ''; $('r-note').value = ''; $('r-hp').value = '';
    $('r-send').disabled = false;
    rmsg('');
    newChallenge();
    dlg.showModal();
  };
  $('r-cancel').onclick = () => dlg.close();
  $('r-id').oninput = () => {
    const g = allProducts.find(p => String(p.ID).trim() === $('r-id').value.trim());
    $('r-name').textContent = g ? g.Name : '';
  };

  $('report-form').onsubmit = e => {
    e.preventDefault();
    const id = $('r-id').value.trim(), reason = $('r-reason').value;
    if ($('r-hp').value) { dlg.close(); return; }                      // فخ للروبوتات
    if (!id) return rmsg('اكتب رقم اللعبة.');
    if (!reason) return rmsg('اختر سبب التبليغ.');
    if (TURNSTILE_SITE_KEY ? !cfToken : Number($('r-math').value) !== mathAns) {
      rmsg(TURNSTILE_SITE_KEY ? 'أكمل التحقق من أنك لست روبوتاً.' : 'إجابة خاطئة، حاول مرة أخرى.');
      if (!TURNSTILE_SITE_KEY) newChallenge();
      return;
    }
    if (reported()[id]) return rmsg('سبق أن بلّغت عن هذه اللعبة، شكراً لك.');
    if (!RATINGS_URL) return rmsg('خدمة التبليغ غير مفعّلة بعد.');

    const prod = allProducts.find(p => String(p.ID).trim() === id) || {};
    const q = { action: 'report', id: id, name: prod.Name || (shownGame && String(shownGame.ID).trim() === id ? shownGame.Name : '') || '',
                link: prod.Affiliate_Link || '', reason: reason, note: $('r-note').value.trim(), token: cfToken, hp: '' };
    $('r-send').disabled = true;
    rmsg('جارٍ الإرسال...');
    fetch(RATINGS_URL + '?' + Object.keys(q).map(k => k + '=' + encodeURIComponent(q[k])).join('&'))
      .then(r => r.json())
      .then(d => {
        if (!d.ok) throw new Error(d.error || 'fail');
        try { const v = reported(); v[id] = 1; localStorage.setItem('myReports', JSON.stringify(v)); } catch (e) {}
        rmsg('تم إرسال البلاغ، شكراً لك!');
        setTimeout(() => dlg.close(), 1500);
      })
      .catch(() => { rmsg('تعذّر الإرسال، حاول لاحقاً.'); $('r-send').disabled = false; newChallenge(); });
  };
</script>
</body>
</html>
